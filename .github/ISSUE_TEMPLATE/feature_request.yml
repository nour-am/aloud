name: Feature request
description: Suggest something Aloud should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Aloud aims to stay small, fast and battery-friendly on e-ink. Ideas that fit that are the most likely to land.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the moment where Aloud gets in your way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
