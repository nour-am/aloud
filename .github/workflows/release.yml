name: Release

# Push a tag like v0.2.0 (matching VERSION in the Makefile) to build, test and
# publish the Kindle zip with its SHA-256. Release notes are taken from
# docs/release-notes/<tag>.md when that file exists.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg clang llvm nasm zip python3-venv

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check the tag matches the version
        run: |
          v=$(sed -n 's/^VERSION ?= //p' Makefile)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Makefile VERSION $v"; exit 1; }
          grep -q "<version>$v</version>" package/config.xml || { echo "package/config.xml is not $v"; exit 1; }

      - name: Build and test
        run: |
          ./scripts/fetch-deps.sh
          ./scripts/build-ffmpeg.sh host
          ./scripts/build-ffmpeg.sh kindle
          make test
          make package
          cd dist && sha256sum aloud-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/aloud-*.zip dist/SHA256SUMS.txt \
            --title "Aloud ${GITHUB_REF_NAME#v}" "$@"
